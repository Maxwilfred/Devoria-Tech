# ── DevoriaTech — configuration de déploiement Netlify ──

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Valeurs publiques (déjà visibles côté client) : le formulaire et WhatsApp
  # fonctionnent dès le déploiement, sans configuration manuelle.
  PUBLIC_FORMSPREE_ID = "xzdlwnyw"
  PUBLIC_WHATSAPP_NUMBER = "212624291947"

# Cache long pour les assets versionnés (hash dans le nom de fichier)
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# En-têtes de sécurité de base
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
